# بناء تطبيق أندرويد (غلاف للموقع) ونشره على صفحة الإصدارات
name: بناء تطبيق أندرويد
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: بناء APK الموقّع
        env:
          VERSION_CODE: "${{ github.run_number }}"
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk dawrak.apk
      # نسخة على موقع دورك نفسه (أسهل للتنزيل من سوريا)
      - name: نشر التطبيق على الموقع
        run: |
          git config --global user.name "dawrak-ci"; git config --global user.email "ci@dawrak.app"
          git pull -q origin main
          git add -f dawrak.apk && git commit -m "تحديث ملف التطبيق على الموقع" && git push origin main || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: تطبيق دورك (نسخة ${{ github.run_number }})
          make_latest: "true"
          files: dawrak.apk
          body: "dawrak.apk: نزّله على جوال الكاشير وثبّته. التطبيق بيفتح الموقع، فالتحديثات بتوصل لحالها."
