<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17201B">
<title>دورك</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest-o.json">
<style>
:root{--c1:#17201B;--c2:#FF7A1A;--on1:#fff;--bg:#FAF7F2;--card:#fff;--ink:#17201B;--mute:#6B6F6A;--line:#ECE7DF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;min-height:100%}
body{padding:0 0 32px}
button{font:inherit;cursor:pointer;border:0}
.top{background:var(--c1);color:var(--on1);padding:22px 16px 64px;text-align:center}
.logo{width:72px;height:72px;border-radius:20px;background:#fff center/cover no-repeat;margin:0 auto 10px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--c1)}
.rname{font-size:21px;font-weight:800}
.wrap{max-width:480px;margin:-48px auto 0;padding:0 16px}
.card{background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:0 10px 30px rgba(23,32,27,.08);margin-bottom:14px}
.lbl{color:var(--mute);font-size:14px;text-align:center}
.num{font-size:96px;line-height:1;font-weight:900;text-align:center;margin:6px 0 18px;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.steps{display:flex;align-items:center;justify-content:space-between;margin:4px 6px 6px;position:relative}
.steps:before{content:"";position:absolute;inset-inline:14px;top:13px;height:4px;background:var(--line);border-radius:4px}
.bar{position:absolute;inset-inline-start:14px;top:13px;height:4px;background:var(--c2);border-radius:4px;transition:width .6s}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mute);width:72px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--card);border:4px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;font-weight:900}
.st.on{color:var(--ink);font-weight:700}.st.on .dot{background:var(--c2);border-color:var(--c2)}
.st.now .dot{box-shadow:0 0 0 6px color-mix(in srgb,var(--c2) 25%,transparent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px transparent}}
.alert{width:100%;margin-top:20px;padding:16px;border-radius:16px;background:var(--c1);color:var(--on1);font-size:17px;font-weight:800;display:flex;gap:10px;align-items:center;justify-content:center}
.alert.ok{background:color-mix(in srgb,var(--c2) 14%,#fff);color:var(--ink);font-weight:700;font-size:15px}
.hint{font-size:13px;color:var(--mute);text-align:center;margin-top:10px;line-height:1.6}
h3{font-size:16px;margin-bottom:12px}
.offers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.offer{flex:0 0 82%;scroll-snap-align:start;border-radius:18px;overflow:hidden;background:color-mix(in srgb,var(--c2) 10%,#fff);border:1px solid var(--line)}
.offer img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
.offer div{padding:12px}.offer b{display:block;margin-bottom:4px}.offer p{font-size:14px;color:var(--mute);line-height:1.5}
.menu img{width:100%;border-radius:14px;display:block;margin-bottom:10px;border:1px solid var(--line)}
.ready{position:fixed;inset:0;z-index:20;background:var(--c2);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:flash 1s infinite}
.ready.show{display:flex}
@keyframes flash{50%{background:var(--c1)}}
.ready .big{font-size:120px;font-weight:900;line-height:1;margin:14px 0}
.ready h1{font-size:30px}
.ready p{font-size:17px;opacity:.95;margin-top:6px}
.ready button{margin-top:34px;background:#fff;color:var(--ink);padding:18px 34px;border-radius:999px;font-size:19px;font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.thanks{text-align:center}
.thanks .e{font-size:54px}
.thanks h2{font-size:24px;margin:6px 0 4px}
.stars{display:flex;justify-content:center;gap:6px;margin:16px 0 6px;direction:ltr}
.stars button{background:none;font-size:40px;color:#D9D3C8;transition:transform .15s}
.stars button.on{color:#FFB400}.stars button:active{transform:scale(1.2)}
.links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.links a{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:14px;background:var(--bg);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--line)}
.links svg{width:20px;height:20px}
.center{text-align:center;padding:60px 20px;color:var(--mute)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--c2);border-radius:50%;margin:0 auto 14px;animation:r 0.8s linear infinite}
@keyframes r{to{transform:rotate(1turn)}}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:18px}
.foot a{color:inherit}
.off{background:#B42318;color:#fff;text-align:center;font-size:13px;padding:6px;position:sticky;top:0;z-index:5;display:none}
</style>
</head>
<body>
<div class="off" id="off"></div>
<div id="root"><div class="center"><div class="spin"></div></div></div>
<script>window.__DAWRAK_NOPERSIST = true;</script>
<script type="module" src="o.js"></script>
</body>
</html>
